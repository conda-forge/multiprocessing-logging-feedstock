{% set name = "multiprocessing-logging" %}
{% set version = "0.4.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/jruere/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: 9346ffdcc7aad97b40dfc4cd6f2faffec2c973197b4f18c6e482d9ec310a3d63

build:
  number: 0
  script: '{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv '
  noarch: python

requirements:
  host:
    - python =2.7.* | >=3.6
    - pip
  run:
    - python =2.7.* | >=3.6

test:
  imports:
    - multiprocessing_logging
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/jruere/multiprocessing-logging
  license: LGPL-3.0-only
  license_family: LGPL
  license_file: LICENSE.txt
  summary: Python tooling to help logging work with multiprocessing
  dev_url: https://github.com/jruere/multiprocessing-logging

extra:
  recipe-maintainers:
    - phlya
    - jordan-heemskerk
